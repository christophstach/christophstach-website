<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
        background:
          radial-gradient(1100px 500px at 78% 18%, rgba(52, 230, 163, 0.1), transparent 60%),
          #080b0a;
        color: #f5f7f7;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .terminal {
        width: 1000px;
        border: 1px solid #2a3331;
        border-radius: 16px;
        background: #0f1514;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 22px;
        border-bottom: 1px solid #1c2422;
        background: #0a0e0d;
      }
      .dots {
        display: flex;
        gap: 9px;
      }
      .dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #2a3331;
      }
      .dots i:first-child {
        background: #34e6a3;
      }
      .path {
        font-size: 19px;
        color: #7d8a8c;
      }
      .body {
        padding: 52px 60px 58px;
      }
      .cmd {
        font-size: 24px;
        color: #7d8a8c;
        margin-bottom: 14px;
      }
      .prompt {
        color: #34e6a3;
        font-weight: 700;
      }
      h1 {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      .role {
        font-size: 30px;
        color: #34e6a3;
        margin-top: 22px;
      }
      .sep {
        color: #7d8a8c;
        margin: 0 14px;
      }
      .desc {
        font-size: 26px;
        color: #c4ccca;
        margin-top: 30px;
        line-height: 1.5;
        max-width: 820px;
      }
      .desc b {
        color: #f5f7f7;
        font-weight: 600;
      }
      .links {
        display: flex;
        gap: 30px;
        margin-top: 40px;
        font-size: 23px;
        color: #7d8a8c;
      }
      .links b {
        color: #34e6a3;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="terminal">
      <div class="bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="path">christoph@berlin: ~</span>
      </div>
      <div class="body">
        <div class="cmd"><span class="prompt">$</span> whoami</div>
        <h1>Christoph Stach</h1>
        <div class="role">
          Senior Full-Stack Engineer<span class="sep">//</span>Berlin<span class="sep">//</span>12+
          yrs
        </div>
        <div class="desc">
          Building modern web apps across <b>Vue/Nuxt</b> and <b>React/Next.js</b> for over a decade
          &mdash; and recently <b>Python backends for AI &amp; LLM agents</b>.
        </div>
        <div class="links">
          <span><b>&rsaquo;</b> christophstach.de</span
          ><span><b>&rsaquo;</b> github.com/christophstach</span>
        </div>
      </div>
    </div>
  </body>
</html>
